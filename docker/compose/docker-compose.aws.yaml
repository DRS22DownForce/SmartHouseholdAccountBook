# ========================================
# AWS EC2 用: ECR のイメージを使う（EC2 上で docker build しない）
# 本体 docker-compose.yaml の profile=prod と併用する
# ========================================

services:
  backend:
    image: ${ECR_BACKEND_IMAGE:?Set ECR_BACKEND_IMAGE in .env}
    pull_policy: always
    build: !reset null

  frontend:
    image: ${ECR_FRONTEND_IMAGE:?Set ECR_FRONTEND_IMAGE in .env}
    pull_policy: always
    build: !reset null
