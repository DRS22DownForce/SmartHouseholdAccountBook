/api/ai/category:
    post:
      tags:
        - ai
      summary: AIカテゴリー自動分類
      description: 支出の説明文から、AIが適切なカテゴリーを自動分類します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ai-category.yaml#/CategoryPredictionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/ai-category.yaml#/CategoryPredictionResponse'
        '400':
          description: 不正なリクエスト（説明文が空など）
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas/expense.yaml#/ErrorResponse'
        '401':
          description: 認証が必要
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas/expense.yaml#/ErrorResponse'
        '429':
          description: AIサービスの利用枠またはレート制限を超過
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas/expense.yaml#/ErrorResponse'
        '502':
          description: AIサービスエラー
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas/expense.yaml#/ErrorResponse'
