# 支出一覧のページネーション用レスポンス
ExpensePageDto:
  type: object
  required:
    - content
    - totalElements
    - totalPages
    - number
    - size
  properties:
    content:
      type: array
      items:
        $ref: '#/ExpenseDto'
      description: 当前ページの支出リスト
    totalElements:
      type: integer
      format: int64
      description: 全体の件数
    totalPages:
      type: integer
      description: 総ページ数
    number:
      type: integer
      description: 現在のページ番号（0始まり）
    size:
      type: integer
      description: 1ページあたりの件数

ExpenseDto:
    type: object
    required:
      - id
      - date
      - category
      - amount
      - description
    properties:
      id:
        type: integer
        format: int64
        description: 家計簿データの一意ID
      date:
        type: string
        format: date
        description: 支出日
      category:
        type: string
        description: 支出カテゴリ
      amount:
        type: integer
        description: 支出金額
      description:
        type: string
        description: 支出の詳細説明
ExpenseRequestDto:
  type: object
  required:
    - date
    - category
    - amount
    - description
  properties:
    date:
      type: string
      format: date 
      description: 支出日
    category:
      type: string
      minLength: 1
      description: 支出カテゴリ
    amount:
      type: integer
      minimum: 1
      description: 支出金額
    description:
      type: string
      minLength: 1
      description: 支出の詳細説明
# TODO: 既存参照の整理後、スキーマ名を ErrorResponse から ProblemDetail に変更する。
ErrorResponse:
  type: object
  description: RFC 9457 Problem Details に準拠したエラーレスポンス
  required:
    - type
    - title
    - status
    - detail
    - instance
  properties:
    type:
      type: string
      format: uri
      description: エラー種別を表すURI。固有の種別がない場合はabout:blank。
      example: about:blank
    title:
      type: string
      description: HTTPステータスの概要
      example: Bad Request
    status:
      type: integer
      format: int32
      description: HTTPステータスコード
      example: 400
    detail:
      type: string
      description: エラーの詳細メッセージ
      example: 入力内容を確認してください。
    instance:
      type: string
      description: エラーが発生したリクエストパス
      example: /api/expenses
    errors:
      type: array
      description: バリデーションエラー時のフィールド別詳細
      items:
        type: object
        required:
          - field
          - message
        properties:
          field:
            type: string
            description: エラー対象のフィールド名
            example: amount
          message:
            type: string
            description: フィールド単位のエラーメッセージ
            example: 1以上を指定してください
MonthlySummaryDto:
    type: object
    description: 月別サマリー用DTO
    required:
      - total
      - count
      - byCategory
    properties:
      total:
        type: integer
        description: 合計支出金額
        example: 50000
      count:
        type: integer
        description: 支出件数
        example: 15
      byCategory:
        type: array
        description: カテゴリー別集計（金額の降順でソート済み）
        items:
          type: object
          required:
            - category
            - amount
          properties:
            category:
              type: string
              description: カテゴリー名
              example: '食費'
            amount:
              type: integer
              description: カテゴリー別の合計金額
              example: 20000
MonthlyReportResponse:
  type: object
  description: AI生成の月次レポート
  required:
    - month
    - summary
    - suggestions
    - generatedAt
  properties:
    month:
      type: string
      description: 対象月（YYYY-MM形式）
      example: '2024-01'
    summary:
      type: string
      description: AIが生成した月次総評
    suggestions:
      type: array
      description: AIが生成した改善提案のリスト
      items:
        type: string
    generatedAt:
      type: string
      format: date-time
      description: レポートの生成日時
CsvUploadResponseDto:
    type: object
    description: CSVアップロード結果用DTO
    required:
      - successCount
      - errorCount
      - skippedCount
      - errors
    properties:
      successCount:
        type: integer
        description: 正常にインポートされたデータ件数
        example: 25
      skippedCount:
        type: integer
        description: 既存データと重複したためスキップした行数
        example: 20
      errorCount:
        type: integer
        description: エラーが発生した行数
        example: 2
      errors:
        type: array
        description: エラー詳細のリスト
        items:
          type: object
          required:
            - lineNumber
            - message
          properties:
            lineNumber:
              type: integer
              description: エラーが発生した行番号
              example: 5
            lineContent:
              type: string
              description: エラーが発生した行の内容
              example: '2025/11/01,xxx店,invalid,1,1,1220,'
            message:
              type: string
              description: エラーメッセージ
              example: '金額が数値として解析できません: invalid'